name: CI

on:
  push:
    branches: 
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install Dependencies
        working-directory: ./app
        run: npm ci

      - name: Run ESLint
        working-directory: ./app
        run: npm run lint

  lint-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install Dependencies
        working-directory: ./api
        run: npm ci

      - name: Run ESLint
        working-directory: ./api
        run: npm run lint
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate app SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./app
          format: spdx-json
          output-file: tulip-app-sbom.spdx.json

      - name: Generate API SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./api
          format: spdx-json
          output-file: tulip-api-sbom.spdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: tulip-sboms
          path: |
            tulip-app-sbom.spdx.json
            tulip-api-sbom.spdx.json
          if-no-files-found: error

      - name: Attest app SBOM provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: tulip-app-sbom.spdx.json

      - name: Attest API SBOM provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: tulip-api-sbom.spdx.json

